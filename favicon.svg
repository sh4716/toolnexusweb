<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 轻微投影，增强悬浮感与立体层次（如不需要可随时删除 filter 属性） -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>

    <!-- 核心齿轮渐变（科技蓝） -->
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- 盾牌渐变（安全深蓝） -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- 主体图形组（已全局居中并适配画布比例） -->
  <g filter="url(#softShadow)" transform="translate(256, 256) scale(1.15) translate(-267, -260)">
    <!-- 1. 本地文件载体（折角文件轮廓） -->
    <path d="M 160 96 H 290 L 372 178 V 400 A 24 24 0 0 1 348 424 H 164 A 24 24 0 0 1 140 400 V 120 A 24 24 0 0 1 164 96 Z" 
          fill="#ffffff" 
          stroke="#1e293b" 
          stroke-width="16" 
          stroke-linejoin="round" 
          stroke-linecap="round" />
    
    <!-- 折角折痕 -->
    <path d="M 288 96 V 180 H 360" 
          fill="none" 
          stroke="#1e293b" 
          stroke-width="16" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- 2. 核心齿轮（代表本地浏览器内的数据加工与工具计算） -->
    <g transform="translate(256, 260)">
      <!-- 齿轮外轮廓 -->
      <path d="M -16 -76 H 16 L 29 -56 C 35 -52 46 -46 56 -38 L 75 -47 L 97 -25 L 88 -6 C 94 4 99 15 103 26 L 123 34 V 66 L 103 74 C 88 85 94 96 88 106 L 97 125 L 75 188 L 56 138 C 46 146 35 152 88 156 L 16 176 H -16 L -24 156 C -35 152 -46 146 -56 138 L -75 147 L -97 125 L -88 106 C -94 96 -99 85 -103 74 L -123 66 V 34 L -103 26 C -99 15 -94 4 -88 -6 L -97 -25 L -75 -47 L -56 -38 C -46 -46 -35 -52 -24 -56 Z"
            transform="scale(0.55) translate(0, -50)"
            fill="url(#gearGrad)" 
            stroke="#1e293b" 
            stroke-width="14" 
            stroke-linejoin="round" />
      <!-- 齿轮中心孔 -->
      <circle cx="0" cy="0" r="24" fill="#ffffff" stroke="#1e293b" stroke-width="14" />
    </g>

    <!-- 3. 本地安全盾牌与锁（突出不上云、数据私密留存在本地） -->
    <g transform="translate(340, 335)">
      <!-- 盾牌外壳 -->
      <path d="M 0 -54 Q 38 -54 52 -32 Q 54 44 0 74 Q -54 44 -54 -32 Q -38 -54 0 -54 Z" 
            fill="url(#shieldGrad)" 
            stroke="#1e293b" 
            stroke-width="14" 
            stroke-linejoin="round" />
      
      <!-- 安全锁环 -->
      <path d="M -11 -2 A 11 11 0 0 1 11 -2 V 8 H -11 Z" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="6" 
            stroke-linecap="round" />
      
      <!-- 锁体 -->
      <rect x="-16" y="8" width="32" height="24" rx="6" fill="#ffffff" />
      <circle cx="0" cy="20" r="3.5" fill="#0369a1" />
    </g>
  </g>
</svg>
